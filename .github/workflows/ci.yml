name: USB Arsenal CI

# One workflow. Every push and pull
# request builds the module zip and the app's APK and uploads them as an
# artifact. A v* tag, or a manual run with tag_name, also publishes them as a
# GitHub release. The toolchains come from Droidspaces' releases and are
# cached between runs. The APK is signed with Droidspaces' key when the
# RELEASE_KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets are
# set, and with a debug key when they are not (a fork, a pull request).
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Publish a release for this tag (existing or new, must match UA_VERSION)"
        required: false
        type: string

permissions:
  # Needed to create the release on a tag; a pull request token is read-only regardless
  contents: write

jobs:
  build:
    name: Build the module (aarch64, armhf, x86_64, x86) and the app
    runs-on: ubuntu-latest
    env:
      # The tag being released, if any
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
      # Droidspaces' musl toolchains, published as release assets; the Makefile
      # finds them in ~/toolchains/<triplet>-cross/bin
      TOOLCHAINS_URL: https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers-25843896720
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive

    # One version, UA_VERSION in usbarsenal.h. A tag must match it, so a
    # forgotten `make bump` fails here instead of shipping.
    - name: Settle the version
      run: |
        VERSION=$(grep "define UA_VERSION" src/include/usbarsenal.h | awk '{print $3}' | tr -d '"')
        if [ -n "$TAG" ]; then
          [ "${TAG#v}" = "$VERSION" ] || { echo "Tag $TAG does not match UA_VERSION $VERSION (run make bump NEW=${TAG#v})"; exit 1; }
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    # The release URL names a fixed set of toolchains, so it is the whole key
    - name: Cache Toolchains
      id: toolchains
      uses: actions/cache@v4
      with:
        path: ~/toolchains
        key: musl-toolchains-${{ env.TOOLCHAINS_URL }}

    - name: Download Toolchains
      if: steps.toolchains.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        for t in aarch64-linux-musl arm-linux-musleabihf x86_64-linux-musl i686-linux-musl; do
          echo "[*] Downloading $t toolchain..."
          wget -q $TOOLCHAINS_URL/$t-cross.tar.zst
          tar -xf $t-cross.tar.zst && rm $t-cross.tar.zst
        done
        echo "[+] Toolchains ready."

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    # The key lives in a secret as base64, as in Droidspaces; without it the
    # release is signed with the debug key
    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      if: env.RELEASE_KEYSTORE != ''
      run: echo "$RELEASE_KEYSTORE" | base64 -d > droidspaces.keystore

    # A release signed with a throwaway key could never update the real app, so
    # a release run without the key stops here instead of publishing one
    - name: Require the key for a release
      if: env.TAG != ''
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        [ -n "$RELEASE_KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Releases are signed with Droidspaces' key: set RELEASE_KEYSTORE and KEYSTORE_PASSWORD"; exit 1; }

    # Gradle's buildBackend runs make module first, so this builds the module
    # zip as well as the APK that bundles its binaries
    - name: Build the module and the app
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd Android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    # Every build, release or not, is named <version>-<commit> so the exact
    # source a zip came from is legible from its filename, as Droidspaces does.
    - name: Stage & Rename Artifacts
      run: |
        HASH=$(git log -1 --pretty=%h)
        ZIP_NAME="usb-arsenal-v${VERSION}-${HASH}.zip"
        APK_NAME="usb-arsenal-v${VERSION}-${HASH}.apk"
        mkdir -p dist
        mv output/usb-arsenal-v${VERSION}.zip dist/${ZIP_NAME}
        mv Android/app/build/outputs/apk/release/app-release.apk dist/${APK_NAME}
        (cd dist && sha256sum ${ZIP_NAME} ${APK_NAME} > SHA256SUMS)
        echo "ZIP_FILE=dist/${ZIP_NAME}" >> $GITHUB_ENV

    - name: Upload Final Artifacts (module zip and APK)
      uses: actions/upload-artifact@v4
      with:
        name: usb-arsenal-artifacts
        path: dist/
        if-no-files-found: error
        retention-days: 14

    # Every commit since the previous tag, as Droidspaces lists them: GitHub's
    # own notes only list pull requests, and this repo has none. On a tag push
    # HEAD is the tag, so the previous one is found from its parent; a manual
    # run for a tag not made yet ends at HEAD
    - name: Generate Changelog
      if: env.TAG != ''
      run: |
        END=HEAD
        git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && END="${TAG}"
        PREV=$(git describe --tags --abbrev=0 "${END}^" 2>/dev/null || true)
        echo "Previous tag: ${PREV:-none}"
        {
          echo "## What's Changed"
          git log --no-merges --pretty=format:"* %s (%h)" ${PREV:+${PREV}..}${END}
          echo
        } > dist/CHANGELOG.md

    - name: Publish GitHub Release
      if: env.TAG != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: USB Arsenal ${{ env.TAG }}
        files: |
          dist/*.zip
          dist/*.apk
          dist/SHA256SUMS
        body_path: dist/CHANGELOG.md
        generate_release_notes: true
        draft: false
        prerelease: false
