name: USB Arsenal CI

# One workflow, laid out like Dragon Control Center's. Every push and pull
# request builds the module zip and uploads it as an artifact. A v* tag, or a
# manual run with tag_name, also publishes it as a GitHub release. The
# toolchains and the Telegram step come from Droidspaces' ci.yml.
on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Publish a release for this tag (existing or new, must match UA_VERSION)"
        required: false
        type: string

permissions:
  # Needed to create the release on a tag; a pull request token is read-only regardless
  contents: write

jobs:
  build:
    name: Build the module (aarch64, armhf, x86_64, x86)
    runs-on: ubuntu-latest
    env:
      # The tag being released, if any
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
      HAS_TELEGRAM: ${{ secrets.API_ID != '' && secrets.API_HASH != '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # One version, UA_VERSION in usbarsenal.h. A tag must match it, so a
    # forgotten `make bump` fails here instead of shipping.
    - name: Settle the version
      run: |
        VERSION=$(grep "define UA_VERSION" src/include/usbarsenal.h | awk '{print $3}' | tr -d '"')
        if [ -n "$TAG" ]; then
          [ "${TAG#v}" = "$VERSION" ] || { echo "Tag $TAG does not match UA_VERSION $VERSION (run make bump NEW=${TAG#v})"; exit 1; }
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget zip zstd

    # Droidspaces' musl toolchains, already published as release assets; the
    # Makefile finds them in ~/toolchains/<triplet>-cross/bin
    - name: Download Toolchains
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        BASE_URL="https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers-25843896720"
        for t in aarch64-linux-musl arm-linux-musleabihf x86_64-linux-musl i686-linux-musl; do
          echo "[*] Downloading $t toolchain..."
          wget -q $BASE_URL/$t-cross.tar.zst
          tar -xf $t-cross.tar.zst
        done
        echo "[+] Toolchains ready."

    - name: Build the KernelSU/Magisk module
      run: make module

    # A release is named by its version alone; any other build carries its commit
    - name: Stage & Rename Artifacts
      run: |
        if [ -n "$TAG" ]; then
          ZIP_NAME="usb-arsenal-v${VERSION}.zip"
        else
          ZIP_NAME="usb-arsenal-v${VERSION}-$(git log -1 --pretty=%h).zip"
        fi
        mkdir -p dist
        mv output/usb-arsenal-${VERSION}.zip dist/${ZIP_NAME}
        (cd dist && sha256sum ${ZIP_NAME} > SHA256SUMS)
        echo "ZIP_FILE=dist/${ZIP_NAME}" >> $GITHUB_ENV

    - name: Upload Final Artifacts (module zip)
      uses: actions/upload-artifact@v4
      with:
        name: usb-arsenal-artifacts
        path: dist/
        if-no-files-found: error
        retention-days: 14

    - name: Publish GitHub Release
      if: env.TAG != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: USB Arsenal ${{ env.TAG }}
        files: |
          dist/*.zip
          dist/SHA256SUMS
        generate_release_notes: true
        draft: false
        prerelease: false

    - name: Generate Telegram Message
      if: github.event_name != 'pull_request'
      run: |
        if [ -n "$TAG" ]; then
          EVENT_TYPE="Release $TAG"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          EVENT_TYPE="Manual Trigger"
        else
          EVENT_TYPE="Git Push"
        fi
        COMMIT_MSG=$(git log -1 --pretty=format:%s)
        COMMIT_SHA=$(git log -1 --pretty=format:%h)
        COMMIT_AUTHOR=$(git log -1 --pretty=format:%an)
        {
          echo "TELEGRAM_MESSAGE<<EOF"
          echo "**USB Arsenal Build Successful**"
          echo ""
          echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})"
          echo "**Branch:** ${{ github.ref_name }}"
          echo "**Author:** $COMMIT_AUTHOR"
          echo "**Event:** $EVENT_TYPE"
          echo "**Commit SHA:** [$COMMIT_SHA](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          echo ""
          echo "**Commit Message:**"
          echo ""
          echo "\`\`\`"
          echo "$COMMIT_MSG"
          echo "\`\`\`"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Send Telegram Notification
      if: |
        github.event_name != 'pull_request' &&
        env.HAS_TELEGRAM == 'true'
      uses: xz-dev/TelegramFileUploader@v1
      with:
        to-who: ${{ secrets.TELEGRAM_TO }}
        message: ${{ env.TELEGRAM_MESSAGE }}
        files: |
          ${{ env.ZIP_FILE }}
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
