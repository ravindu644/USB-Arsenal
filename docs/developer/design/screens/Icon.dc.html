<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>USB Arsenal app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
.lcd{--lcd:#FFA62E;--ink:#1C1005;position:relative;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:var(--lcd);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
.sheet{width:1100px;height:640px;display:grid;grid-template-columns:512px minmax(0,1fr);gap:48px;padding:40px;background:var(--ink);color:var(--lcd)}
.t{font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:20px;text-transform:none}
.b{font-weight:700}
.big{margin:0;font-family:'Jersey 10','Silkscreen',sans-serif;font-weight:400;line-height:.8}
.title{font-size:72px}
.ic{position:relative;flex:none;display:flex;align-items:center;justify-content:center;background:var(--lcd);color:var(--ink);overflow:hidden}
.ic::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px)}
.ic.round{border-radius:50%}
.ic.dark{background:var(--ink);color:var(--lcd);box-shadow:inset 0 0 0 2px var(--lcd)}
.ic.dark::after{display:none}
.pin{position:relative;display:block}
.pin svg{display:block}
.shut{position:absolute;inset:0;opacity:0;background:var(--lcd);animation:shut 2.6s steps(1,end) infinite}
.dark .shut{background:var(--ink)}
@keyframes shut{0%{opacity:0}70%{opacity:1}76%{opacity:0}84%{opacity:1}90%{opacity:0}}
.cap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
@media (prefers-reduced-motion:reduce){.lcd *{animation:none!important}}
</style>
</helmet>
<div class="lcd sheet">
  <div class="cap">
    <div class="ic" style="width:512px;height:512px" role="img" aria-label="USB Arsenal app icon, 512 pixels">
      <span class="pin" aria-hidden="true">
        <svg width="288" height="324" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pin}}" fill="currentColor"></path></svg>
        <span class="shut"><svg width="288" height="324" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pinBlink}}" fill="currentColor"></path></svg></span>
      </span>
    </div>
    <span class="t">512 · play store</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:32px">
    <h1 class="big title">Pin</h1>
    <div style="display:flex;gap:32px;align-items:flex-end">
      <div class="cap">
        <div class="ic" style="width:192px;height:192px" role="img" aria-label="Launcher icon, square">
          <span class="pin" aria-hidden="true"><svg width="96" height="108" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pin}}" fill="currentColor"></path></svg></span>
        </div>
        <span class="t">192 · launcher</span>
      </div>
      <div class="cap">
        <div class="ic round" style="width:192px;height:192px" role="img" aria-label="Launcher icon, round mask">
          <span class="pin" aria-hidden="true"><svg width="96" height="108" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pin}}" fill="currentColor"></path></svg></span>
        </div>
        <span class="t">192 · round mask</span>
      </div>
    </div>
    <div style="display:flex;gap:32px;align-items:flex-end">
      <div class="cap">
        <div class="ic dark" style="width:96px;height:96px" role="img" aria-label="Themed icon">
          <span class="pin" aria-hidden="true"><svg width="48" height="54" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pin}}" fill="currentColor"></path></svg></span>
        </div>
        <span class="t">96 · themed</span>
      </div>
      <div class="cap">
        <div class="ic" style="width:96px;height:96px" role="img" aria-label="Icon at 96 pixels">
          <span class="pin" aria-hidden="true"><svg width="48" height="54" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pin}}" fill="currentColor"></path></svg></span>
        </div>
        <span class="t">96</span>
      </div>
      <div class="cap">
        <div class="ic" style="width:48px;height:48px" role="img" aria-label="Icon at 48 pixels">
          <span class="pin" aria-hidden="true"><svg width="32" height="36" viewBox="0 0 16 18" shape-rendering="crispEdges"><path d="{{pin}}" fill="currentColor"></path></svg></span>
        </div>
        <span class="t">48</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":640}}'>
class Component extends DCLogic {
  px(rows) {
    let d = '';
    rows.forEach((r, y) => {
      for (let x = 0; x < r.length; ) {
        if (r[x] !== '#') { x++; continue; }
        const s = x;
        while (r[x] === '#') x++;
        d += 'M' + s + ' ' + y + 'h' + (x - s) + 'v1h-' + (x - s) + 'z';
      }
    });
    return d;
  }
  renderVals() {
    const top = ['...##########...', '...#........#...'];
    const body = ['..############..', '.##############.', '.##############.', '.######..######.', '.##############.', '.##############.', '..############..', '....##.##.##....', '....##.##.##....', '...###.##.###...', '.......##.......', '.......####.....', '..........##....'];
    return {
      pin: this.px(top.concat(['...#.##..##.#...', '...#.##..##.#...', '...#........#...'], body)),
      pinBlink: this.px(top.concat(['...#........#...', '...#.##..##.#...', '...#........#...'], body))
    };
  }
}
</script>
</body>
</html>
