<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
.lcd{--lcd:#FFA62E;--ink:#1C1005;position:relative;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:var(--lcd);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px)}
.phone{width:390px;height:844px;padding-bottom:68px}
.t{font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:20px;text-transform:none}
.b{font-weight:700}
.big{margin:0;font-family:'Jersey 10','Silkscreen',sans-serif;font-weight:400;line-height:.8}
.title{font-size:72px}
.inv{background:var(--ink);color:var(--lcd)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.key{font:inherit;font-weight:700;color:var(--ink);background:var(--lcd);border:2px solid var(--ink);min-height:44px;padding:0 14px;box-sizing:border-box;box-shadow:4px 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-transform:uppercase;cursor:pointer}
.key:active{transform:translate(4px,4px);box-shadow:none}
.segs{display:flex;border:2px solid var(--ink)}
.seg{all:unset;box-sizing:border-box;flex:1 1 0;min-width:0;min-height:44px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.seg + .seg{border-left:2px solid var(--ink)}
.key.pri{background:var(--ink);color:var(--lcd)}
.seg.on{background:var(--ink);color:var(--lcd)}
.luns{align-self:flex-start}
.luns .seg{flex:0 0 40px}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 10px;cursor:pointer}
.row.on{background:var(--ink);color:var(--lcd)}
.lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.st{display:block;overflow:hidden;white-space:nowrap;container-type:inline-size}
.st > span{display:inline-block;min-width:100%;animation:mq 8s steps(32,end) infinite alternate}
@keyframes mq{0%,20%{transform:translateX(0)}80%,100%{transform:translateX(min(0px,calc(100cqw - 100%)))}}
.tag{padding:0 6px;background:var(--ink);color:var(--lcd)}
.drive{position:relative;height:150px;flex:none;border:2px solid var(--ink);overflow:hidden}
.face{position:absolute;top:0;left:0;right:0;height:40px;z-index:3;display:flex;align-items:center;gap:10px;padding:0 4px 0 12px}
.led{width:8px;height:8px;background:var(--lcd);animation:led 1.2s steps(1,end) infinite}
@keyframes led{30%{visibility:hidden}40%{visibility:visible}55%{visibility:hidden}60%{visibility:visible}}
.ej{all:unset;margin-left:auto;min-width:44px;min-height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.label{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:0 14px}
.tray{position:absolute;top:40px;left:14px;right:14px;height:106px;z-index:2;background:var(--lcd);border:2px solid var(--ink);border-top:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;transform:translateY(-110px);transition:transform .3s steps(3,end)}
.tray.open{transform:translateY(0)}
.ghost{position:relative;display:block}
.ghost::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(var(--lcd) 0 25%,transparent 0 50%) 0 0/4px 4px}
.lcd :focus-visible{outline:2px dashed currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.lcd *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="lcd phone">
  <div class="top">
    <a class="key" href="Main.dc.html" aria-label="Back to the gadget">&lt; Back</a>
  </div>
  <h1 class="big title">Storage</h1>
  <div class="segs luns" role="radiogroup" aria-label="LUN">
    <button class="seg on" role="radio" aria-checked="true">0</button>
    <button class="seg" role="radio" aria-checked="false">1</button>
    <button class="seg" aria-label="Add a LUN">+</button>
  </div>

  <div class="drive">
    <div class="face inv">
      <span class="led" aria-hidden="true"></span>
      <span class="b">lun0</span>
      <button class="ej" onClick="{{eject}}" aria-label="Eject" disabled="{{open}}">
        <svg width="24" height="20" viewBox="0 0 12 10" shape-rendering="crispEdges" aria-hidden="true"><path d="{{ejectIcon}}" fill="currentColor"></path></svg>
      </button>
    </div>
    <div class="label">
      <svg width="64" height="64" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path d="{{disc}}" fill="currentColor"></path></svg>
      <span class="lines">
        <span class="t st"><span>{{img.name}}</span></span>
        <span class="t" style="display:flex;gap:8px;align-items:center"><span>{{img.size}} · {{kind}}</span><span class="tag">{{access}}</span></span>
      </span>
    </div>
    <div class="{{trayClass}}" aria-hidden="{{trayHidden}}">
      <span class="ghost"><svg width="80" height="80" viewBox="0 0 16 16" shape-rendering="crispEdges" style="display:block"><path d="{{disc}}" fill="currentColor"></path></svg></span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="b">Mode</span>
    <div class="segs" role="radiogroup" aria-label="Mode">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
        <button class="{{m.cls}}" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}">{{m.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{warn}}" hint-placeholder-val="{{ false }}">
      <span class="t inv" style="padding:8px 10px">{{warn}}</span>
    </sc-if>
  </div>

  <div style="display:flex;flex-direction:column;gap:2px;margin:0 -10px;flex:1;min-height:0;overflow:auto">
    <div style="display:flex;justify-content:space-between;padding:0 10px 4px"><span class="b">Files</span><span class="t">/sdcard/USB-Arsenal</span></div>
    <sc-for list="{{imgs}}" as="i" hint-placeholder-count="4">
      <button class="{{i.cls}}" role="radio" aria-checked="{{i.checked}}" disabled="{{i.busy}}" onClick="{{i.pick}}">
        <span class="t st" style="flex:1;min-width:0"><span>{{i.name}}</span></span>
        <sc-if value="{{i.lun}}" hint-placeholder-val="{{ false }}"><span class="t tag">{{i.lun}}</span></sc-if><span class="t">{{i.size}}</span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <button class="key">Pick image</button>
    <button class="key pri">Create</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  px(rows) {
    let d = '';
    rows.forEach((r, y) => {
      for (let x = 0; x < r.length; ) {
        if (r[x] !== '#') { x++; continue; }
        const s = x;
        while (r[x] === '#') x++;
        d += 'M' + s + ' ' + y + 'h' + (x - s) + 'v1h-' + (x - s) + 'z';
      }
    });
    return d;
  }
  renderVals() {
    const st = Object.assign({ mode: 'auto', img: 0, open: false }, this.state || {});
    const save = (p) => this.setState(Object.assign({ mode: st.mode, img: st.img, open: st.open }, p));
    const list = [
      { name: 'Win11_24H2_x64.iso', size: '5.8G', gb: 5.8, auto: 'dvd' },
      { name: 'archlinux-2026.10.01-x86_64.iso', size: '1.2G', gb: 1.2, auto: 'disk' },
      { name: 'drivers-2025.iso', size: '412M', gb: 0.4, auto: 'cdrom' },
      { name: 'pendrive.img', size: '4.0G', gb: 4, auto: 'dvd', lun: 'lun1' }
    ];
    const img = list[st.img];
    const kind = st.mode === 'auto' ? img.auto : st.mode === 'rw' ? 'disk' : st.mode;
    let warn = '';
    if (st.mode === 'cdrom' && img.gb > 2.36) warn = 'cd-rom stops at 2.36G. the host reads a truncated disc';
    else if (st.mode === 'rw') warn = 'host can write to this file';
    return {
      disc: this.px(['.....######.....', '...##......##...', '..#.#........#..', '.#.##.........#.', '.#....####....#.', '#....#....#....#', '#...#......#...#', '#...#..##..#...#', '#...#..##..#...#', '#...#......#...#', '#....#....#....#', '.#....####....#.', '.#............#.', '..#..........#..', '...##......##...', '.....######.....']),
      ejectIcon: this.px(['.....##.....', '....####....', '...######...', '..########..', '.##########.', '############', '............', '............', '############', '############']),
      img, kind, warn,
      access: st.mode === 'rw' ? 'rw' : 'ro',
      open: st.open,
      trayClass: 'tray' + (st.open ? ' open' : ''),
      trayHidden: st.open ? 'false' : 'true',
      eject: () => save({ open: true }),
      modes: ['auto', 'cdrom', 'dvd', 'disk', 'rw'].map((m) => ({
        label: m === 'cdrom' ? 'cd' : m, cls: 'seg' + (st.mode === m ? ' on' : ''), checked: st.mode === m ? 'true' : 'false', pick: () => save({ mode: m })
      })),
      imgs: list.map((x, n) => ({
        name: x.name, size: x.size, lun: x.lun || '', busy: !!x.lun,
        cls: 'row' + (n === st.img && !st.open ? ' on' : ''), checked: n === st.img ? 'true' : 'false',
        pick: () => save({ img: n, open: false })
      }))
    };
  }
}
</script>
</body>
</html>
