<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
.lcd{--lcd:#FFA62E;--ink:#1C1005;position:relative;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:var(--lcd);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px)}
.phone{width:390px;height:844px;padding-bottom:68px}
.s{font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase}
.t{font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:20px;text-transform:none}
.b{font-weight:700}
.big{margin:0;font-family:'Jersey 10','Silkscreen',sans-serif;font-weight:400;line-height:.8}
.title{font-size:72px}
.hero{font-size:104px}
.inv{background:var(--ink);color:var(--lcd)}
.blk{display:inline-block;width:10px;height:16px;margin-left:4px;vertical-align:-2px;background:currentColor;animation:blk 1s steps(1,end) infinite}
.big .blk{width:.32em;height:.62em;vertical-align:0}
@keyframes blk{50%{visibility:hidden}}
.stage{position:relative;height:330px;flex:none;margin:-22px -20px 0;overflow:hidden}
.host{position:absolute;top:0;left:0;right:0;height:96px;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;padding:22px 20px 0;box-sizing:border-box}
.slot{position:absolute;left:calc(50% - 34px);top:66px;width:68px;height:30px;z-index:4;background:var(--ink);box-shadow:inset 0 0 0 2px var(--lcd);animation:slot 5s step-end infinite}
.slot::before{content:"";position:absolute;left:4px;right:4px;top:4px;height:10px;background:var(--ink)}
@keyframes slot{0%{background:var(--lcd)}66%{background:var(--ink)}}
.pin{position:absolute;left:calc(50% - 48px);top:66px;width:96px;z-index:2;animation:seek 5s step-end infinite}
@keyframes seek{0%{transform:translate(0,250px)}18%{transform:translate(-6px,180px)}33%{transform:translate(6px,120px)}46%{transform:translate(0,64px)}57%{transform:translate(0,28px)}66%{transform:translate(0,0)}}
.cable{position:absolute;left:60px;top:108px;width:12px;height:40px;background:var(--ink)}
.cable::after{content:"";position:absolute;left:0;top:28px;width:400px;height:12px;background:var(--ink)}
.spark{position:absolute;top:100px;z-index:4;visibility:hidden;animation:spark 5s step-end infinite}
@keyframes spark{66%{visibility:visible}76%{visibility:hidden}}
.flash{position:absolute;inset:0;z-index:8;background:var(--lcd);mix-blend-mode:difference;pointer-events:none;visibility:hidden;animation:flash 5s step-end infinite}
@keyframes flash{67%{visibility:visible}70%{visibility:hidden}}
.say{animation:say 5s step-end infinite}
@keyframes say{0%{visibility:hidden}70%{visibility:visible}}
.fr{--bgc:var(--lcd);position:relative;height:96px;overflow:hidden;background:var(--bgc);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.fr .hb{position:absolute;top:0;left:0;right:0;height:20px;background:currentColor;z-index:2}
.fr .hs{position:absolute;left:calc(50% - 12px);top:12px;width:24px;height:8px;background:var(--bgc);z-index:3}
.fr .hs::before{content:"";position:absolute;left:2px;right:2px;top:2px;height:2px;background:var(--ink)}
.fr.bound .hs{background:var(--ink);box-shadow:inset 0 0 0 2px var(--lcd)}
.fr .sp{position:absolute;top:26px;z-index:3;display:none}
.fr.bound .sp{display:block}
.fr svg{position:absolute;left:calc(50% - 16px);display:block}
.fr .cb{position:absolute;left:calc(50% + 4px);width:4px;height:80px;background:currentColor}
@media (prefers-reduced-motion:reduce){.lcd *{animation:none!important;transition:none!important}}
</style>
