<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
.lcd{--lcd:#FFA62E;--ink:#1C1005;position:relative;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:var(--lcd);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
.sheet{width:1100px;height:640px;display:grid;grid-template-columns:512px minmax(0,1fr);gap:48px;padding:40px;background:var(--ink);color:var(--lcd)}
.t{font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:20px;text-transform:none}
.b{font-weight:700}
.big{margin:0;font-family:'Jersey 10','Silkscreen',sans-serif;font-weight:400;line-height:.8}
.title{font-size:72px}
.ic{position:relative;flex:none;display:flex;align-items:center;justify-content:center;background:var(--lcd);color:var(--ink);overflow:hidden}
.ic::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px)}
.ic.round{border-radius:50%}
.ic.dark{background:var(--ink);color:var(--lcd);box-shadow:inset 0 0 0 2px var(--lcd)}
.ic.dark::after{display:none}
.pin{position:relative;display:block}
.pin svg{display:block}
.shut{position:absolute;inset:0;opacity:0;background:var(--lcd);animation:shut 2.6s steps(1,end) infinite}
.dark .shut{background:var(--ink)}
@keyframes shut{0%{opacity:0}70%{opacity:1}76%{opacity:0}84%{opacity:1}90%{opacity:0}}
.cap{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
@media (prefers-reduced-motion:reduce){.lcd *{animation:none!important}}
</style>
</head><body>
