<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
.lcd{--lcd:#FFA62E;--ink:#1C1005;position:relative;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:var(--lcd);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px)}
.phone{width:390px;height:844px;padding-bottom:68px}
.t{font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:20px;text-transform:none}
.b{font-weight:700}
.big{margin:0;font-family:'Jersey 10','Silkscreen',sans-serif;font-weight:400;line-height:.8}
.title{font-size:72px}
.inv{background:var(--ink);color:var(--lcd)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.key{font:inherit;font-weight:700;color:var(--ink);background:var(--lcd);border:2px solid var(--ink);min-height:44px;padding:0 14px;box-sizing:border-box;box-shadow:4px 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-transform:uppercase;cursor:pointer}
.key:active{transform:translate(4px,4px);box-shadow:none}
.segs{display:flex;border:2px solid var(--ink)}
.seg{all:unset;box-sizing:border-box;flex:1 1 0;min-width:0;min-height:44px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.seg + .seg{border-left:2px solid var(--ink)}
.key.pri{background:var(--ink);color:var(--lcd)}
.seg.on{background:var(--ink);color:var(--lcd)}
.luns{align-self:flex-start}
.luns .seg{flex:0 0 40px}
.drive{position:relative;height:150px;flex:none;border:2px solid var(--ink);overflow:hidden}
.face{position:absolute;top:0;left:0;right:0;height:40px;z-index:3;display:flex;align-items:center;gap:10px;padding:0 4px 0 12px}
.led{width:8px;height:8px;box-sizing:border-box;border:2px solid var(--lcd)}
.tray{position:absolute;top:40px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.ghost{position:relative;display:block}
.ghost::after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(var(--lcd) 0 25%,transparent 0 50%) 0 0/4px 4px}
.shut{position:absolute;inset:0;opacity:0;background:var(--lcd);animation:shut 2.6s steps(1,end) infinite}
@keyframes shut{0%{opacity:0}70%{opacity:1}76%{opacity:0}84%{opacity:1}90%{opacity:0}}
.lcd :focus-visible{outline:2px dashed currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.lcd *{animation:none!important;transition:none!important}}
</style>
</head><body>

<div class="lcd phone">
  <div class="top">
    <a class="key" href="Main.dc.html" aria-label="Back to the gadget">&lt; Back</a>
  </div>
  <h1 class="big title">Storage</h1>
  <div class="segs luns" role="radiogroup" aria-label="LUN">
    <button class="seg on" role="radio" aria-checked="true">0</button>
    <button class="seg" aria-label="Add a LUN">+</button>
  </div>

  <div class="drive" aria-hidden="true">
    <div class="face inv"><span class="led"></span><span class="b">lun0</span></div>
    <div class="tray">
      <span class="ghost"><svg width="80" height="80" viewBox="0 0 16 16" shape-rendering="crispEdges" style="display:block"><path d="M5 0h6v1h-6zM3 1h2v1h-2zM11 1h2v1h-2zM2 2h1v1h-1zM13 2h1v1h-1zM1 3h1v1h-1zM14 3h1v1h-1zM1 4h1v1h-1zM6 4h4v1h-4zM14 4h1v1h-1zM0 5h1v1h-1zM5 5h1v1h-1zM10 5h1v1h-1zM15 5h1v1h-1zM0 6h1v1h-1zM4 6h1v1h-1zM11 6h1v1h-1zM15 6h1v1h-1zM0 7h1v1h-1zM4 7h1v1h-1zM7 7h2v1h-2zM11 7h1v1h-1zM15 7h1v1h-1zM0 8h1v1h-1zM4 8h1v1h-1zM7 8h2v1h-2zM11 8h1v1h-1zM15 8h1v1h-1zM0 9h1v1h-1zM4 9h1v1h-1zM11 9h1v1h-1zM15 9h1v1h-1zM0 10h1v1h-1zM5 10h1v1h-1zM10 10h1v1h-1zM15 10h1v1h-1zM1 11h1v1h-1zM6 11h4v1h-4zM14 11h1v1h-1zM1 12h1v1h-1zM14 12h1v1h-1zM2 13h1v1h-1zM13 13h1v1h-1zM3 14h2v1h-2zM11 14h2v1h-2zM5 15h6v1h-6z" fill="currentColor"></path></svg></span>
    </div>
  </div>

  <div style="position:relative;height:150px;flex:none" aria-hidden="true">
    <svg style="position:absolute;left:calc(50% - 86px);top:16px" width="36" height="36" viewBox="0 0 9 9" shape-rendering="crispEdges"><path d="M2 0h5v1h-5zM1 1h2v1h-2zM6 1h2v1h-2zM6 2h2v1h-2zM5 3h2v1h-2zM4 4h2v1h-2zM4 5h2v1h-2zM4 7h2v1h-2zM4 8h2v1h-2z" fill="currentColor"></path></svg>
    <div style="position:absolute;left:calc(50% - 42px);top:0;width:128px;height:144px">
      <svg width="128" height="144" viewBox="0 0 16 18" shape-rendering="crispEdges" style="display:block"><path d="M3 0h10v1h-10zM3 1h1v1h-1zM12 1h1v1h-1zM3 2h1v1h-1zM5 2h2v1h-2zM9 2h2v1h-2zM12 2h1v1h-1zM3 3h1v1h-1zM5 3h2v1h-2zM9 3h2v1h-2zM12 3h1v1h-1zM3 4h1v1h-1zM12 4h1v1h-1zM2 5h12v1h-12zM1 6h14v1h-14zM1 7h14v1h-14zM1 8h6v1h-6zM9 8h6v1h-6zM1 9h14v1h-14zM1 10h14v1h-14zM2 11h12v1h-12zM4 12h2v1h-2zM7 12h2v1h-2zM10 12h2v1h-2zM4 13h2v1h-2zM7 13h2v1h-2zM10 13h2v1h-2zM3 14h3v1h-3zM7 14h2v1h-2zM10 14h3v1h-3zM7 15h2v1h-2zM7 16h4v1h-4zM10 17h2v1h-2z" fill="currentColor"></path></svg>
      <span class="shut"><svg width="128" height="144" viewBox="0 0 16 18" shape-rendering="crispEdges" style="display:block"><path d="M3 0h10v1h-10zM3 1h1v1h-1zM12 1h1v1h-1zM3 2h1v1h-1zM12 2h1v1h-1zM3 3h1v1h-1zM5 3h2v1h-2zM9 3h2v1h-2zM12 3h1v1h-1zM3 4h1v1h-1zM12 4h1v1h-1zM2 5h12v1h-12zM1 6h14v1h-14zM1 7h14v1h-14zM1 8h6v1h-6zM9 8h6v1h-6zM1 9h14v1h-14zM1 10h14v1h-14zM2 11h12v1h-12zM4 12h2v1h-2zM7 12h2v1h-2zM10 12h2v1h-2zM4 13h2v1h-2zM7 13h2v1h-2zM10 13h2v1h-2zM3 14h3v1h-3zM7 14h2v1h-2zM10 14h3v1h-3zM7 15h2v1h-2zM7 16h4v1h-4zM10 17h2v1h-2z" fill="currentColor"></path></svg></span>
    </div>
  </div>
  <span class="b" style="text-align:center">No image loaded</span>

  <div style="margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <button class="key">Pick image</button>
    <button class="key pri">Create</button>
  </div>
</div>
</body></html>
