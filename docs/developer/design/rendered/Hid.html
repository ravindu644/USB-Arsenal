<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
.lcd{--lcd:#FFA62E;--ink:#1C1005;position:relative;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:22px 20px 20px;background:var(--lcd);color:var(--ink);font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px),repeating-linear-gradient(90deg,rgba(28,16,5,.06) 0 1px,transparent 1px 2px)}
.phone{width:390px;height:844px;padding-bottom:68px}
.s{font-family:'Silkscreen',ui-monospace,monospace;font-size:16px;line-height:20px;text-transform:uppercase}
.t{font-family:'VT323',ui-monospace,monospace;font-size:22px;line-height:20px;text-transform:none}
.b{font-weight:700}
.big{margin:0;font-family:'Jersey 10','Silkscreen',sans-serif;font-weight:400;line-height:.8}
.title{font-size:72px}
.hero{font-size:104px}
.inv{background:var(--ink);color:var(--lcd)}
.d25{background-image:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 100%);background-size:4px 4px}
.d50{background-image:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%);background-size:4px 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.key{font:inherit;font-weight:700;color:var(--ink);background:var(--lcd);border:2px solid var(--ink);min-height:44px;padding:0 14px;box-sizing:border-box;box-shadow:4px 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-transform:uppercase;cursor:pointer}
.key:active{transform:translate(4px,4px);box-shadow:none}
.segs{display:flex;border:2px solid var(--ink)}
.seg{all:unset;box-sizing:border-box;flex:1 1 0;min-width:0;min-height:44px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none}
.seg + .seg{border-left:2px solid var(--ink)}
.seg:active{background:var(--ink);color:var(--lcd)}
.lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.pad{position:relative;height:236px;flex:none;border:2px solid var(--ink);border-bottom:0;overflow:hidden;cursor:none;touch-action:none}
.wheel{position:absolute;top:0;right:0;bottom:0;width:44px;border-left:2px solid var(--ink);background:var(--lcd);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0;box-sizing:border-box}
.wheel .w{flex:1;width:16px;margin:8px 0;background:repeating-linear-gradient(180deg,var(--ink) 0 4px,transparent 4px 10px)}
.rep{display:flex;flex-direction:column;gap:5px}
.rep > div{display:flex;align-items:baseline;gap:8px}
.rep .bytes{margin-left:auto;white-space:nowrap}
.inp{all:unset;box-sizing:border-box;flex:1;min-width:0;min-height:44px;border:2px solid var(--ink);padding:0 10px;font-family:'VT323',monospace;font-size:22px;text-transform:none}
.inp::placeholder{color:var(--ink);opacity:1}
.read{min-width:44px;min-height:44px;box-sizing:border-box;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.lcd :focus-visible{outline:2px dashed currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.lcd *{animation:none!important;transition:none!important}}
</style>
</head><body>

<div class="lcd phone">
  <div class="top">
    <a class="key" href="Main.dc.html" aria-label="Back to the gadget">&lt; Back</a>
  </div>
  <h1 class="big title">HID</h1>

  <div style="display:flex;flex-direction:column">
    <div class="pad d25" aria-label="Trackpad" role="application">
      <svg style="position:absolute;left:132px;top:96px;display:block" width="16" height="24" viewBox="0 0 8 12" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 0h1v1h-1zM0 1h2v1h-2zM0 2h3v1h-3zM0 3h4v1h-4zM0 4h5v1h-5zM0 5h6v1h-6zM0 6h7v1h-7zM0 7h4v1h-4zM0 8h2v1h-2zM3 8h2v1h-2zM0 9h1v1h-1zM3 9h2v1h-2zM4 10h2v1h-2zM4 11h2v1h-2z" style="fill:var(--ink);stroke:var(--lcd);stroke-width:1;paint-order:stroke"></path></svg>
      <div class="wheel" aria-hidden="true"><span class="b">^</span><span class="w"></span><span class="b">v</span></div>
    </div>
    <div class="segs">
      <button class="seg">L</button>
      <button class="seg">M</button>
      <button class="seg">R</button>
    </div>
  </div>

  <div class="t rep" aria-live="polite">
    <div><span class="s b">Mouse</span><span>hidg2</span><span class="bytes">00 0a fe 00</span></div>
    <div><span class="s b">Kbd</span><span>hidg1</span><span class="bytes">00 00 04 00 00 00 00 00</span></div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
    
      <button class="key" style="padding:0 4px">ESC</button>
    
      <button class="key" style="padding:0 4px">TAB</button>
    
      <button class="key" style="padding:0 4px">CTRL</button>
    
      <button class="key" style="padding:0 4px">ALT</button>
    
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <label for="hid-type" class="b">Type</label>
    <input id="hid-type" class="inp" placeholder="text goes to the host" value="a" autocomplete="off">
  </div>

  <div class="kv">
    <span class="lines"><span class="b">Interval</span><span class="t">1 ms</span></span>
    <button class="key" style="padding:0 4px;width:44px" aria-label="Poll faster">-</button>
    <span class="read t" aria-label="Interval exponent">04</span>
    <button class="key" style="padding:0 4px;width:44px" aria-label="Poll slower">+</button>
  </div>
</div>
</body></html>
